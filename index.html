  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.includes('-dev-') || window.location.port !== '';
      
      // Global utility to force clear cache and update service worker
      window.forceUpdateApp = async () => {
        console.log('Force updating app...');
        if ('serviceWorker' in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              await registration.update();
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            }
          } catch (e) {
            console.error('Error during Service Worker update:', e);
          }
        }
        if (window.caches) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
            console.log('All caches cleared');
          } catch (e) {
            console.error('Error clearing caches:', e);
          }
        }
        // Hard reload
        window.location.reload();
      };

      if ('serviceWorker' in navigator) {
        // Handled automatically by vite-plugin-pwa in production/shared preview
        console.log('PWA Service Worker registration handled by vite-plugin-pwa');
      }
    </script>
  </body>
